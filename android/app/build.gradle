apply plugin: 'com.android.application'

android {
    namespace "com.mydox.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mydox.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

/**
 * FIX for project paths with spaces ('-P-Project '):
 * Intercepts the generated 'capacitor.build.gradle', replaces URI-based string paths
 * with safe File-based paths, and applies the fixed version.
 */
def capBuildFile = file('capacitor.build.gradle')
if (capBuildFile.exists()) {
    try {
        def content = capBuildFile.text
        def pluginVarsFile = file('../capacitor-cordova-android-plugins/cordova.variables.gradle')
        
        // Use the absolute path and escape backslashes
        def absolutePath = pluginVarsFile.absolutePath.replace('\\', '/')
        
        // Replace the relative string path with a hardcoded absolute File reference
        content = content.replaceAll(
            /apply from:\s*['"]\.\.\/capacitor-cordova-android-plugins\/cordova\.variables\.gradle['"]/,
            "apply from: project.file('${absolutePath}')"
        )
        
        def fixedFile = file('capacitor.build.gradle.fixed')
        fixedFile.text = content
        
        logger.lifecycle("Applying fixed Capacitor build script: ${fixedFile.absolutePath}")
        apply from: fixedFile
    } catch (Exception e) {
        logger.warn("Capacitor sanitization failed: ${e.message}")
        // As a last resort, if the fix fails, we don't apply the original broken one
    }
}

tasks.register('validateReleaseWebApp') {
    doLast {
        def configFile = file('src/main/assets/capacitor.config.json')
        def config = configFile.exists() ? new groovy.json.JsonSlurper().parse(configFile) : [:]
        if (config.server?.url || !file('src/main/assets/public/index.html').exists()) {
            throw new GradleException('MyDox is configured for a development preview.')
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found")
}
