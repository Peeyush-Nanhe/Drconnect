plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
include ':app'
rootProject.name = 'MyDox'

// Manually define the project and its directory to ensure it's found despite path spaces
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File(rootDir, 'capacitor-cordova-android-plugins')

apply from: 'capacitor.settings.gradle'
